# LoRA structure — MLX-LM reads these fields from YAML config only; no
# matching CLI flags. Daily knobs iters / batch-size / learning-rate / num-layers
# stay on the command line (see train.py / sweep.py).

lora_parameters:
  # Industrial tool-calling SFT practice (Hermes-Function-Calling V3 / Watt-Tool / xLAM):
  # attach LoRA to all four attention projections, covering semantic matching + routing
  # inside attention. q/v only is the sft_hello toy minimum — structural tasks (schema
  # learning) need more capacity.
  keys:
    - "self_attn.q_proj"
    - "self_attn.k_proj"
    - "self_attn.v_proj"
    - "self_attn.o_proj"

  # Bottleneck dimension r — LoRA's core knob.
  # 16 is mainstream for tool-calling SFT (middle of 8–32); toy default 8 is too small for
  # tool schema learning (see sweep.py rank sweep).
  rank: 16

  # ΔW scale = alpha / rank; MLX-LM uses scale directly.
  # alpha=32, rank=16 → scale=2.0; matches LoRA paper rule alpha = 2×rank.
  scale: 2.0

  # Dropout on LoRA output during training. Small 766-sample set — light regularization.
  dropout: 0.05
