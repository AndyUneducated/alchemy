# QA test-plan workflow — QA instance of kitchen_sink schema (plan §4.3)
#
#   cd play/
#   python -m workflow run qa_assets/workflows/qa_supervisor.yaml \
#       --vars csv_path=qa_assets/examples/req_tracker.csv
#
# 6 stages: load → load_prds → serialize_for_agent → discuss → render_md → render_csv

name: qa_supervisor
description: CSV (requirements + schedule) -> multi-agent test plan collaboration (md artifact)

vars:
  csv_path:
    required: true                                # input CSV path
  output_dir:
    default: "/tmp/qa_out"

hooks_module: qa_assets.hooks

stages:
  - name: load
    type: deterministic
    fn: load_csv
    args: {csv_path: "{{ vars.csv_path }}"}
    # output → "load"; shape list[dict]

  - name: load_prds
    type: deterministic
    fn: load_each_prd                             # rows with prd_doc_path: Path.read_text() → prd_md
    args: {requirements: "{{ stages.load.output }}"}
    # output → "load_prds"; shape list[dict]

  - name: serialize_for_agent
    type: deterministic
    fn: to_yaml                                   # explicit serialization, not in template (plan §4.3)
    args: {obj: "{{ stages.load_prds.output }}"}
    # output → "serialize_for_agent"; shape str (yaml-formatted)

  - name: discuss
    type: agent
    scenario: ../scenarios/qa_discuss.md
    config:                                       # unpacked wholesale into Engine.invoke(**config)
      initial_artifact:
        Requirements: "{{ stages.serialize_for_agent.output }}"
      artifact_path: "{{ vars.output_dir }}/test_plan_artifact.md"
      transcript_path: "{{ vars.output_dir }}/transcript.json"
      print_stream: true                          # PoC: multi-agent loop visible in CLI
    output: discussion                            # → Result.artifact dict

  - name: render_md
    type: deterministic
    fn: render_md
    args:
      sections: "{{ stages.discussion.output }}"  # artifact dict (6 sections)
      requirements: "{{ stages.load_prds.output }}"   # pass through sprint/assignee metadata
      template: "{{ pkg_dir }}/../templates/test_plan.md.j2"
      output_path: "{{ vars.output_dir }}/test_plan.md"

  - name: render_csv
    type: deterministic
    fn: render_csv                                # flatten sections['Test Cases'] to rows
    args:
      sections: "{{ stages.discussion.output }}"
      requirements: "{{ stages.load_prds.output }}"
      output_path: "{{ vars.output_dir }}/cases.csv"
