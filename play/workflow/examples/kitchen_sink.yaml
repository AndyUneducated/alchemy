# ============================================================================
# Workflow kitchen sink — field reference + mental model for a complete workflow.yaml
# ============================================================================
# This is a **runnable** workflow.yaml that uses every field once.
# Each `#` comment explains semantics / values / defaults. Strip comments for minimal form.
#
#   cd play/
#   python -m workflow run workflow/examples/kitchen_sink.yaml \
#       --vars greeting=Hello \
#       --vars n_lines=3
#
# Prerequisites:
#   - play/agent_engine/scenarios/roundtable.md exists (P0 migration)
#   - echo / enrich_lines / write_md / to_yaml in workflow.examples.kitchen_sink_hooks
#     (~30 lines Python, see kitchen_sink_hooks.py in same directory)
#
# Don't want the agent stage? Remove the discuss stage and downstream references.
# ============================================================================

# ── Top-level metadata ─────────────────────────────────────────────────────
name: kitchen_sink              # required. workflow identifier; error messages reference this
description: |                  # optional. documentation only; runner does not consume
  Demonstrates every field of workflow.yaml schema with inline notes.

# ── vars (workflow input parameters) ─────────────────────────────────────
# Injected via CLI --vars k=v. All stages reference via {{ vars.<name> }}.
# Fields:
#   required: true   — must pass or startup sys.exit
#   default: <val>   — string default when omitted; mutually exclusive with required
#   type: <kind>     — int|float|bool|str (default str). cast only, no range validation
vars:
  greeting:
    required: true                        # CLI must pass --vars greeting=...
  n_lines:
    default: "3"
    type: int
  output_dir:
    default: "/tmp/workflow_out"

# ── hooks_module ──────────────────────────────────────────────────────────
# Default Python namespace for deterministic stage fn string resolution.
# Optional if every deterministic stage uses explicit "pkg.sub:func".
#   fn: "echo"           → import workflow.examples.kitchen_sink_hooks.echo
#   fn: "other.pkg:foo"  → explicit path (colon = full path, skips hooks_module)
hooks_module: workflow.examples.kitchen_sink_hooks

# ── stages (executed serially in list order) ───────────────────────────────
# Each stage needs at least name, type. Other fields vary by type.
#   type: deterministic   → call Python function (hooks_module or explicit path)
#   type: agent           → call agent_engine.Engine.invoke()
#
# Common fields:
#   name              required; globally unique
#   output            optional; return value available at stages.<output>.output
#                      defaults to stage.name if omitted
#
# Variable interpolation (in args / config / scenario string values):
#   {{ vars.<name> }}           — vars defined above (required or default)
#   {{ stages.<name>.output }}  — prior stage output
#   {{ pkg_dir }}               — absolute path to workflow.yaml directory
# **No** expressions / filters / conditionals; missing path raises KeyError. Data
# transforms belong in hook functions (e.g. to_yaml below), not templates.
# When the whole string is {{ x.y }}, preserve original Python type (list/dict/...);
# embedded placeholders force str().

stages:
  # ── deterministic stage (basic) ──
  - name: greet
    type: deterministic                   # required: deterministic | agent
    fn: echo                              # required; resolves to hooks_module.echo
    args:                                 # optional; omit → fn() with no kwargs. values interpolatable
      message: "{{ vars.greeting }}"
      count: "{{ vars.n_lines }}"
    output: greeting_lines                # optional; default "greet"

  # ── reference prior stage output ──
  - name: enrich
    type: deterministic
    fn: enrich_lines
    args:
      lines: "{{ stages.greeting_lines.output }}"  # list[str] from echo
      tag: "[from workflow]"
    # output omitted → "enrich"; shape list[str]

  # ── explicit serialize stage (instead of template filter) ──
  - name: serialize
    type: deterministic
    fn: to_yaml                           # dump arbitrary structure to yaml string
    args: {obj: "{{ stages.enrich.output }}"}
    # output → "serialize"; shape str (yaml-formatted)

  # ── agent stage ──
  - name: discuss
    type: agent
    scenario: ../../agent_engine/scenarios/roundtable.md   # required; path relative to workflow.yaml
    config:                               # optional dict; workflow does not parse contents,
                                          # unpacked wholesale as kwargs to Engine.invoke(**config).
                                          # Decouples agent_engine internals (initial_artifact /
                                          # save_transcript / callbacks) from workflow schema.
      # roundtable.md has no artifact; initial_artifact unused unless artifact.enabled=true:
      # initial_artifact:
      #   Topic: "{{ stages.serialize.output }}"
      transcript_path: "{{ vars.output_dir }}/transcript.json"
      # callbacks: ...                    # allowed but Callback is a Python object;
                                          # PoC usually skips callbacks in yaml
    output: discussion                    # agent stage output is Result.artifact (dict[str, str])

  # ── final deterministic stage ──
  - name: write_summary
    type: deterministic
    fn: write_md
    args:
      sections: "{{ stages.discussion.output }}"     # discussion artifact dict
      output_path: "{{ vars.output_dir }}/summary.md"
      pkg_dir: "{{ pkg_dir }}"                       # workflow.yaml directory

# ============================================================================
# Omission rules
#   - name / stages: required
#   - description / hooks_module / vars: optional (hooks_module skippable if all fn use colon form)
#   - args / config: omit → fn / Engine.invoke() with no kwargs
#   - output: omit → defaults to stage.name
#
# Stage type comparison
#   type=deterministic              type=agent
#   ──────────────────              ──────────────────
#   fn (required)                    scenario (required, path)
#   args (optional, fn kwargs)       config (optional, Engine.invoke kwargs, pass-through)
#   return → stages.<output>         Result.artifact → stages.<output>
#
# Variable interpolation
#   {{ vars.<name> }} / {{ stages.<n>.output }} / {{ pkg_dir }}
#   path access only, no expressions / filters. transforms in hooks (e.g. to_yaml).
#
# Runtime mental model
#   1. One run = stages list expanded serially. No parallel / branch / loop.
#   2. Each stage return lands in state[stages.<output>.output]; later stages reference
#      via templates; default output name equals stage.name.
#   3. Template interpolation happens before stage call, expanding args/config strings.
#   4. deterministic stage = plain Python function; raise = fail-fast, no runner retry.
#      retry/timeout via tenacity/signal inside hooks (plan §9).
#   5. agent stage = Engine(scenario).invoke(**config); workflow oblivious to config keys.
#   6. CLI streams stage events (start / done / duration_ms) to stdout for humans.
# ============================================================================
