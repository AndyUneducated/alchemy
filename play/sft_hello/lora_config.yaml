# LoRA structure — MLX-LM reads these fields from YAML config only;
# no CLI flags. Daily knobs iters / batch-size / learning-rate / num-layers
# stay on the command line.

lora_parameters:
  # Which weight matrices get LoRA. MLX-LM defaults to these two; Qwen2.5 uses the same names.
  keys: ["self_attn.q_proj", "self_attn.v_proj"]

  # Bottleneck dimension r — LoRA's core knob.
  # 8 is overkill for the toy task but matches MLX-LM default for cross-run comparison.
  rank: 8

  # ΔW scale (≈ alpha/rank form; MLX-LM default 20.0).
  # How much the A·B patch is scaled in W + A·B.
  scale: 20.0

  # Dropout on LoRA output during training. Tiny toy data needs no regularization.
  dropout: 0.0
