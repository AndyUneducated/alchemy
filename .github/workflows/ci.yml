name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      EVALS_OLLAMA_BASE_URL: http://127.0.0.1:11434
      OLLAMA_HOST: http://127.0.0.1:11434
      # Store blobs on the workspace volume (larger + cacheable) instead of ~/.ollama.
      OLLAMA_MODELS: ${{ github.workspace }}/.cache/ollama/models
      # GHA runners lack RAM for 27b; 9b keeps live judge / traj tests runnable.
      EVALS_TEST_OLLAMA_MODEL: qwen3.5:9b
      AGENT_ENGINE_MODEL: qwen3.5:9b
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      TRANSFORMERS_CACHE: ${{ github.workspace }}/.cache/huggingface
      # Avoid unauthenticated HF Hub tokenizer downloads during CI fixture ingest.
      RAG_EMBED_TOKENIZER: basic

    steps:
      - uses: actions/checkout@v4

      # ubuntu-latest has ~14GB free; two Ollama pulls + torch + HF cache exceed it without cleanup.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Cache Hugging Face
        uses: actions/cache@v4
        with:
          path: .cache/huggingface
          key: hf-${{ runner.os }}-${{ hashFiles('play/rag/config.py', 'requirements-ci.txt') }}
          restore-keys: |
            hf-${{ runner.os }}-

      - name: Cache Ollama models
        uses: actions/cache@v4
        with:
          path: .cache/ollama/models
          key: ollama-${{ runner.os }}-qwen3.5-9b-qwen3-embedding-8b-v1
          restore-keys: |
            ollama-${{ runner.os }}-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements-ci.txt

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama and pull models
        run: |
          set -euo pipefail
          mkdir -p "$OLLAMA_MODELS"
          df -h
          ollama serve &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:11434/api/tags >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -sf http://127.0.0.1:11434/api/tags
          echo "Pulling qwen3.5:9b (~6GB)..."
          ollama pull qwen3.5:9b
          df -h
          echo "Pulling qwen3-embedding:8b (~5GB)..."
          ollama pull qwen3-embedding:8b
          df -h
          ollama list

      - name: Build RAG VDB fixtures
        working-directory: play/rag
        run: |
          python ingest.py --docs docs/test_vdb --output vdb/test_vdb
          python ingest.py --docs docs/panel --output vdb/panel

      - name: Run full test suite
        run: python -m pytest -v --tb=short
